<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HALO — film de marque (démo)</title>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal}
@font-face{font-family:"Archivo";src:url(fonts/archivo-latin-wdth-italic.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:italic}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;unicode-range:U+0000-00FF,U+2010-2027,U+2190-21FF}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;unicode-range:U+0000-00FF,U+2010-2027,U+2190-21FF}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-ext-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;unicode-range:U+0100-024F}
@font-face{font-family:"Instrument Serif";src:url(fonts/instrument-serif-latin-ext-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;unicode-range:U+0100-024F}

:root{
  --ink:#0A0A12; --ink2:#14141F; --cream:#F3EEE4; --violet:#5B3BFF; --violet-d:#2B168F;
  --coral:#FF5533; --magenta:#FF3D9A; --amber:#FFB627;
  --halo:conic-gradient(from 200deg,#5B3BFF,#FF3D9A 28%,#FF5533 52%,#FFB627 74%,#5B3BFF);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;font-kerning:normal}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none}
.abs{position:absolute}
.c{position:absolute;left:50%;top:50%}
.p3{transform-style:preserve-3d}
.ar{font-family:"Archivo",sans-serif}
.se{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
.mono{font-family:"JetBrains Mono",monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.mw{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.12em .08em .16em;margin:-.12em -.08em -.16em}
.mwi{display:inline-block}
.mc{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.24em .04em .04em;margin:-.24em -.04em -.04em;white-space:pre}
.mci{display:inline-block}
/* the brand ring */
.ring{background:var(--halo)}
.ball{border-radius:50%}
.ball.coral{background:radial-gradient(circle at 32% 28%,#FFE3DA 0,#FF8C70 14%,#FF5533 48%,#B82A10 100%)}
.ball.violet{background:radial-gradient(circle at 32% 28%,#E6DFFF 0,#9A83FF 14%,#5B3BFF 48%,#2B168F 100%)}
.ball.amber{background:radial-gradient(circle at 32% 28%,#FFF4D6 0,#FFD36E 14%,#FFB627 48%,#B87400 100%)}
.ball.magenta{background:radial-gradient(circle at 32% 28%,#FFE0EF 0,#FF85BE 14%,#FF3D9A 48%,#A8125A 100%)}
.ball.creamb{background:radial-gradient(circle at 32% 28%,#fff 0,#F3EEE4 30%,#CFC6B4 100%)}
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib.js"></script>
<script src="scenes/parts.js"></script>
<script src="scenes/s1.js"></script>
<script src="scenes/s2.js"></script>
<script src="scenes/s3.js"></script>
<script src="scenes/s4.js"></script>
<script src="scenes/s6.js"></script>
<script src="scenes/s7.js"></script>
<script src="scenes/s8.js"></script>
<script>
  // fonts first (scenes measure text when they are built), then build + draw
  Promise.all([
    '900 100px Archivo', 'italic 900 100px Archivo', '100px "Instrument Serif"', 'italic 100px "Instrument Serif"',
    '500 20px "JetBrains Mono"', '600 20px Inter', '800 20px Inter', '400 20px Inter',
  ].map(f => document.fonts.load(f, 'AaÉé0'))).then(() => {
    boot();
    // manual preview: index.html#120 shows frame 120
    const hf = parseFloat(location.hash.slice(1));
    seek(isNaN(hf) ? 0 : hf);
    window.__ready = true;
  });
</script>
</body>
</html>
